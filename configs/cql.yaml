algorithm: cql
actor_lr: 1.0e-4
critic_lr: 1.0e-4
alpha_lr: 1.0e-4
conservative_weight: 5.0
n_action_samples: 10
initial_alpha: 1.0
# Match d3rlpy's CQL default. This target is meaningful only when rewards are
# kept on a stable scale.
alpha_threshold: 10.0
reward_scaler: standard
batch_size: 256
total_steps: 100000
eval_freq: 5000
